<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Bhumi 🌸</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff0f5;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;padding:24px 16px 48px}
#app{width:100%;max-width:400px}
.prog{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.d{width:10px;height:10px;border-radius:50%;background:#e8ccd5}
.d.on{background:#d4537e}
.hbox{position:relative;height:48px;overflow:visible;pointer-events:none;margin-bottom:4px}
.hf{position:absolute;bottom:0;font-size:20px;pointer-events:none}
@keyframes pop{0%{opacity:1;transform:translateY(0) scale(0.5)}100%{opacity:0;transform:translateY(-55px) scale(1.3)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wag{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.bun{display:block;margin:0 auto 6px;cursor:pointer;animation:bob 3s ease-in-out infinite}
.bun.wag{animation:wag 0.6s ease-in-out}
.tag{text-align:center;font-size:12px;color:#d4537e;font-weight:600;margin-bottom:4px}
.msg{background:#fff;border:2px solid #f4c0d1;border-radius:18px;padding:16px;font-size:15px;color:#333;line-height:1.85;font-style:italic;text-align:left;position:relative;margin-bottom:12px}
.msg:after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#f4c0d1}
.msg:before{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-2px;border:7px solid transparent;border-top-color:#fff;z-index:1}
.hint{text-align:center;font-size:12px;color:#bbb;margin-bottom:10px}
.choices{display:flex;flex-direction:column;gap:10px}
.ch{width:100%;background:#fff;border:2px solid #f4c0d1;border-radius:14px;padding:14px;font-size:15px;color:#72243e;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;line-height:1.5}
.ch:active{background:#fbeaf0}
.ic{font-size:20px;flex-shrink:0}
.fc{animation:fin 0.6s ease}
.fcard{background:#fff;border:2px solid #f4c0d1;border-radius:22px;padding:24px 18px}
.ftop{font-size:24px;letter-spacing:5px;text-align:center;margin-bottom:8px}
.fh{font-size:19px;font-weight:700;color:#72243e;text-align:center;margin-bottom:14px}
.fb{font-size:15px;color:#555;line-height:2.1;font-style:italic;text-align:left}
.fs{font-size:15px;color:#d4537e;font-weight:600;text-align:center;margin-top:14px}
.fbot{font-size:18px;letter-spacing:5px;text-align:center;margin-top:14px}
#musicbtn{position:fixed;top:14px;right:14px;background:#fff;border:2px solid #f4c0d1;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(212,83,126,0.2);z-index:999}
#overlay{position:fixed;inset:0;background:rgba(255,240,245,0.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px;padding:24px}
#overlay h2{font-size:22px;color:#72243e;text-align:center;line-height:1.6}
#overlay p{font-size:14px;color:#b07090;text-align:center}
#startbtn{background:#d4537e;color:#fff;border:none;border-radius:16px;padding:14px 32px;font-size:17px;cursor:pointer;box-shadow:0 4px 16px rgba(212,83,126,0.35)}
</style>
</head>
<body>
<div id="overlay">
  <div style="font-size:60px">&#127800;</div>
  <h2>Someone sent you something from the heart...</h2>
  <p>Tap below to open it with music &#127925;</p>
  <button id="startbtn" onclick="startExp()">Open my message &#128149;</button>
</div>
<div id="musicbtn" onclick="toggleMusic()">&#127925;</div>
<audio id="bg" loop preload="auto">
  <source src="https://adityagarg941.github.io/for-bhumi/music.mp3" type="audio/mpeg">
</audio>
<div id="app"></div>
<script>
var s=0, playing=false;
var audio=document.getElementById("bg");

function startExp(){
  document.getElementById("overlay").style.display="none";
  audio.volume=0.4;
  audio.currentTime=0;
  var p=audio.play();
  if(p!==undefined){
    p.then(function(){
      playing=true;
      document.getElementById("musicbtn").textContent="&#127925;";
    }).catch(function(e){
      console.log("Audio failed:",e);
      playing=false;
      document.getElementById("musicbtn").textContent="&#128263;";
    });
  }
  draw();
}

function toggleMusic(){
  if(playing){
    audio.pause();
    playing=false;
    document.getElementById("musicbtn").textContent="&#128263;";
  } else {
    audio.play();
    playing=true;
    document.getElementById("musicbtn").textContent="&#127925;";
  }
}

var data=[
  {m:"happy",t:"Hii Bhumi&#8230; &#127800; I&#8217;m a little bunny who hopped all the way here just to deliver the softest, most heartfelt message. Will you let me speak to you?",c:[{i:"&#127800;",t:"Aww okay little bunny, go ahead&#8230;"},{i:"&#127827;",t:"I&#8217;m listening, come here&#8230;"}]},
  {m:"sad",t:"Yesterday&#8230; the person who loves you most in this world didn&#8217;t act like it. He knows he hurt you. And it has been eating him alive ever since. He is truly, deeply sorry Bhumi.",c:[{i:"&#127783;",t:"It really did hurt me&#8230;"},{i:"&#128148;",t:"I didn&#8217;t expect that from him"}]},
  {m:"plead",t:"He knows he&#8217;s not perfect. But he is perfectly yours. Other boys are other boys &#8212; Aadii is the one who stays up thinking about you, who feels broken when you&#8217;re hurt. And for not showing you that side of him yesterday, he is truly, deeply sorry Bhumi.",c:[{i:"&#129293;",t:"Maybe I&#8217;ve been too harsh&#8230;"},{i:"&#128154;",t:"I hear him, little bunny&#8230;"}]},
  {m:"hope",t:"He&#8217;s not asking you to forget yesterday. He&#8217;s just standing here, with his whole heart in his hands, promising you &#8212; it will never happen again. And this isn&#8217;t just an apology, Bhumi. It&#8217;s a promise wrapped in every feeling he has for you. Not because he has to say it, but because hurting you is something he simply cannot bear.",c:[{i:"&#10024;",t:"That promise means everything&#8230;"},{i:"&#127802;",t:"I want to believe him so much"}]},
  {m:"happy",t:"Bhumi, you are not just special. You are the kind of rare and precious person that someone finds once in a lifetime. He found you. And he is terrified of ever losing you. &#128149;",c:[{i:"&#128151;",t:"I&#8217;m ready to read his heart &#128151;"},{i:"&#127799;",t:"Show me, little bunny &#127799;"}]}
];

function bsvg(mood){
  var bl='<animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 1;1 0.05;1 1;1 1;1 1" dur="3.5s" repeatCount="indefinite" additive="sum"/>';
  var ey={
    happy:'<g transform="translate(52,98)"><ellipse rx="9" ry="10" fill="#1a1a2e"/><ellipse cx="-3" cy="-3" rx="3" ry="3" fill="white"/>'+bl+'</g><g transform="translate(108,98)"><ellipse rx="9" ry="10" fill="#1a1a2e"/><ellipse cx="-3" cy="-3" rx="3" ry="3" fill="white"/>'+bl+'</g><ellipse cx="52" cy="112" rx="7" ry="4" fill="#f9a8c0" opacity="0.8"/><ellipse cx="108" cy="112" rx="7" ry="4" fill="#f9a8c0" opacity="0.8"/><path d="M68 114 Q80 122 92 114" stroke="#d4537e" stroke-width="2.5" fill="none" stroke-linecap="round"/>',
    sad:'<g transform="translate(52,100)"><ellipse rx="8" ry="9" fill="#1a1a2e"/><ellipse cx="-3" cy="-2" rx="3" ry="3" fill="white"/>'+bl+'</g><g transform="translate(108,100)"><ellipse rx="8" ry="9" fill="#1a1a2e"/><ellipse cx="-3" cy="-2" rx="3" ry="3" fill="white"/>'+bl+'</g><path d="M47 93 Q52 89 57 92" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M103 92 Q108 89 113 93" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="52" cy="112" rx="7" ry="4" fill="#f9a8c0" opacity="0.9"/><ellipse cx="108" cy="112" rx="7" ry="4" fill="#f9a8c0" opacity="0.9"/><path d="M68 116 Q80 112 92 116" stroke="#d4537e" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="57" cy="107" rx="3" ry="4" fill="#aed6f1" opacity="0.9"/>',
    plead:'<g transform="translate(52,98)"><ellipse rx="10" ry="12" fill="#1a1a2e"/><ellipse cx="-3" cy="-3" rx="3.5" ry="3.5" fill="white"/>'+bl+'</g><g transform="translate(108,98)"><ellipse rx="10" ry="12" fill="#1a1a2e"/><ellipse cx="-3" cy="-3" rx="3.5" ry="3.5" fill="white"/>'+bl+'</g><ellipse cx="52" cy="112" rx="7" ry="4" fill="#f9a8c0" opacity="0.85"/><ellipse cx="108" cy="112" rx="7" ry="4" fill="#f9a8c0" opacity="0.85"/><path d="M68 116 Q80 113 92 116" stroke="#d4537e" stroke-width="1.8" fill="none"/>',
    hope:'<g transform="translate(52,97)"><ellipse rx="9" ry="10" fill="#1a1a2e"/><ellipse cx="-3" cy="-3" rx="3" ry="3" fill="white"/>'+bl+'</g><g transform="translate(108,97)"><ellipse rx="9" ry="10" fill="#1a1a2e"/><ellipse cx="-3" cy="-3" rx="3" ry="3" fill="white"/>'+bl+'</g><ellipse cx="52" cy="112" rx="7" ry="4" fill="#f9a8c0" opacity="0.8"/><ellipse cx="108" cy="112" rx="7" ry="4" fill="#f9a8c0" opacity="0.8"/><path d="M66 114 Q80 123 94 114" stroke="#d4537e" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
  };
  return '<svg class="bun" id="bunsvg" width="148" height="188" viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg">'
  +'<ellipse cx="42" cy="28" rx="14" ry="32" fill="#f5e6d8" transform="rotate(-12 42 28)"/>'
  +'<ellipse cx="42" cy="28" rx="7" ry="20" fill="#f9c8d8" transform="rotate(-12 42 28)"/>'
  +'<ellipse cx="118" cy="28" rx="14" ry="32" fill="#f5e6d8" transform="rotate(12 118 28)"/>'
  +'<ellipse cx="118" cy="28" rx="7" ry="20" fill="#f9c8d8" transform="rotate(12 118 28)"/>'
  +'<ellipse cx="80" cy="105" rx="52" ry="58" fill="#f5e6d8"/>'
  +'<ellipse cx="80" cy="118" rx="30" ry="22" fill="#fde8f0"/>'
  +(ey[mood]||ey.happy)
  +'<circle cx="80" cy="123" r="4" fill="#e88aaa"/>'
  +'<path d="M74 128 Q80 '+(mood==="sad"?"131":"136")+' 86 128" stroke="#d4537e" stroke-width="1.5" fill="none" stroke-linecap="round"/>'
  +'<ellipse cx="80" cy="160" rx="28" ry="32" fill="#f5e6d8"/>'
  +'<ellipse cx="52" cy="178" rx="16" ry="12" fill="#f5e6d8" transform="rotate(20 52 178)"/>'
  +'<ellipse cx="108" cy="178" rx="16" ry="12" fill="#f5e6d8" transform="rotate(-20 108 178)"/>'
  +'<path d="M80 192 Q96 184 108 190 Q118 195 115 200" stroke="#f5e6d8" stroke-width="9" fill="none" stroke-linecap="round"/>'
  +'<circle cx="115" cy="200" r="7" fill="#fde8f0"/>'
  +'</svg>';
}

function spawnH(){
  var b=document.getElementById("hb");
  if(!b)return;
  var em=["&#128149;","&#127800;","&#10024;","&#128151;","&#127799;","&#127827;"];
  for(var i=0;i<5;i++){(function(n){setTimeout(function(){
    var h=document.createElement("span");
    h.className="hf";
    h.innerHTML=em[Math.floor(Math.random()*em.length)];
    h.style.left=(8+Math.random()*140)+"px";
    h.style.animation="pop 1.4s ease forwards";
    b.appendChild(h);
    setTimeout(function(){if(h.parentNode)h.parentNode.removeChild(h);},1500);
  },n*130);})(i);
}
}

function wagBun(){
  var b=document.getElementById("bunsvg");if(!b)return;
  b.classList.remove("wag");void b.offsetWidth;b.classList.add("wag");
  setTimeout(function(){b.classList.remove("wag");},700);
  spawnH();
}

function next(){
  spawnH();s++;
  var a=document.getElementById("app");
  a.style.transition="opacity 0.2s";a.style.opacity="0";
  setTimeout(function(){draw();a.style.opacity="1";},220);
}

function draw(){
  var a=document.getElementById("app");
  if(s>=data.length){
    a.innerHTML='<div class="fc"><div class="hbox" id="hb"></div><div style="text-align:center">'+bsvg("happy")+'</div><div class="fcard"><div class="ftop">&#128157; &#127800; &#128157;</div><div class="fh">My dearest Bhumi,</div><div class="fb">I am so deeply, truly sorry for how I behaved yesterday.<br><br>You did not deserve a single moment of it &#8212; and that thought has been weighing on my heart ever since.<br><br>I know sorry alone doesn&#8217;t undo it. But I want you to feel how genuinely I mean it &#8212; in every part of me.<br><br>Please don&#8217;t compare me to others. I am not them. I am just your Aadii &#8212; flawed, but loving you in the most real, honest way I know how.<br><br>I promise you, Bhumi &#8212; this will never happen again. Not because I have to say it, but because losing your smile is the one thing I could never live with.<br><br>You are the most special person in my entire world. Always and only. &#128048;&#128149;</div><div class="fs">&#8212; yours always, Aadii &#127800;</div></div><div class="fbot">&#10024; &#127799; &#10024;</div></div>';
    document.getElementById("bunsvg").addEventListener("click",wagBun);
    setTimeout(function(){spawnH();setInterval(spawnH,2200);},700);
    return;
  }
  var r=data[s];
  var dots="";for(var i=0;i<data.length;i++)dots+='<div class="d'+(i<s?" on":"")+'"></div>';
  var btns="";for(var j=0;j<r.c.length;j++)btns+='<button class="ch" onclick="next()"><span class="ic">'+r.c[j].i+'</span>'+r.c[j].t+'</button>';
  a.innerHTML='<div class="prog">'+dots+'</div><div class="hbox" id="hb"></div>'+bsvg(r.m)+'<div class="tag">&#128048; little bunny messenger</div><div class="msg">'+r.t+'</div><div class="hint">tap the bunny for magic &#10024;</div><div class="choices">'+btns+'</div>';
  document.getElementById("bunsvg").addEventListener("click",wagBun);
}
</script>
</body>
</html>
